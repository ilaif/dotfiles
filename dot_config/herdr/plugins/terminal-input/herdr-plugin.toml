id = "ilai.terminal-input"
name = "Terminal Input"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Flags plain terminal panes as a blocked 'Terminal input' agent when a running command waits at a prompt; toasts when a long command finishes in an unfocused pane"
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "./watch.py", "--spawn"]

[[events]]
on = "pane.created"
command = ["python3", "./watch.py", "--spawn"]
